group = mod_group_id
version = mod_version

base {
    archivesName = mod_name
}

neoForge {
    if (Boolean.getBoolean(enableAccessTransformers)) {
        accessTransformers = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // The 4.6 context is created by FractureLoader's early-window service.
        // Keep it as a separate development coordinate so this mod's metadata is still discovered.
        fracture_loader {
            sourceSet project(':FractureLoader').sourceSets.main
        }
    }
}

repositories {
    maven { url "https://maven.taumc.org/releases" }
    flatDir { dirs "libs" }
}

dependencies {
//    compileOnly "org.embeddedt.celeritas:celeritas-common:2.4.0-dev.5"
//    compileOnly jarJar(group:"org.embeddedt.celeritas", name:"Celeritas", version: "neoforge-mc21.1-2.4.0-dev")
    // The Host deliberately keeps its renderer-facing API in an isolated source set. Consume
    // that API explicitly while keeping the actual Host project as the development runtime.
    compileOnly(project(path: ':HaikalatHost', configuration: 'haikalatHostApiElements'))
    compileOnly(rootProject.ext.haikalatCoordinates) {
        transitive = false
    }
    implementation(project(':HaikalatHost'))
    implementation(project(':CrystalLib'))
    implementation(project(':CrystalFracture'))

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
    testImplementation(rootProject.ext.haikalatCoordinates) {
        transitive = false
    }
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neoforge_version_range : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            haikalat_host_version_range: haikalat_host_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def isRunningInIdea() {
    return System.getProperty("idea.active") == "true"
}
