var projectName = [
        //TODO
        "ActionGuide",
        "CrystalLib",
//        "HazeDungeon",
//        "NuQuest"
]

group = mod_group_id
version = mod_version

base {
    archivesName = mod_name
}

neoForge {
    if (Boolean.getBoolean(enableAccessTransformers)) {
        accessTransformers = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    projectName.forEach { mod -> implementation (project(":" + mod)) }

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testImplementation("com.google.code.gson:gson:2.10.1")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

sourceSets.test {
    // WeaponSchema's strong IDs wrap Minecraft's ResourceLocation, but the plain
    // JUnit source set does not inherit ModDev's generated Minecraft artifact.
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neoforge_version_range : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
