group = mod_group_id
version = mod_version

base {
    archivesName = mod_name
}

neoForge {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // Haikalat is bundled by FractureLoader and must be present in development runs.
        fracture_loader {
            sourceSet project(':FractureLoader').sourceSets.main
        }
    }

    runs {
        client {
            def quickPlayWorld = providers.gradleProperty('haikalathostQuickPlayWorld').orNull
            if (quickPlayWorld != null && !quickPlayWorld.isBlank()) {
                programArguments.addAll '--quickPlaySingleplayer', quickPlayWorld
            }
        }
    }
}

def haikalatJar = project(':FractureLoader').file('libs/haikalat-0.17.2.jar')

dependencies {
    compileOnly(project(':FractureLoader'))
    compileOnly files(haikalatJar)

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neoforge_version_range : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
