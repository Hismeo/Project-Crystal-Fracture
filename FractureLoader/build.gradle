group = mod_group_id
version = mod_version

base {
    archivesName = mod_name
}

neoForge {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named("jar", Jar).configure {
    archiveFileName.set("fracture-loader-${project.version}.jar")
    manifest {
        attributes("Automatic-Module-Name": "org.hismeo.fracture_loader")
    }
}

tasks.named("sourcesJar", Jar).configure {
    archiveFileName.set("fracture-loader-${project.version}-sources.jar")
}

tasks.register("verifyBootstrapPackaging") {
    group = "verification"
    description = "Verifies that the early loader does not contain the Haikalat runtime."
    dependsOn(tasks.named("jar"))

    doLast {
        def archive = tasks.named("jar").get().archiveFile.get().asFile
        def forbiddenPrefixes = [
                "com/kaleblangley/haikalat/",
                "org/lwjgl/",
                "vfx/"
        ]
        def forbiddenEntries = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (forbiddenPrefixes.any { entry.name.startsWith(it) }) {
                    forbiddenEntries.add(entry.name)
                }
            }
        }
        if (!forbiddenEntries.isEmpty()) {
            throw new GradleException(
                    "FractureLoader must remain bootstrap-only; forbidden entries in "
                            + archive.name + ": " + forbiddenEntries.take(10))
        }
    }
}

tasks.named("check").configure {
    dependsOn(tasks.named("verifyBootstrapPackaging"))
}
